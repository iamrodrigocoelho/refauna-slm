[project]
name = "refauna-slm"
version = "0.1.0"
description = "Aplicação local (Mac M1, offline) do Refauna SLM: RAG híbrido + Gemma 4 E2B / Qwen3.5-2B fine-tunados via Ollama."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.31.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.4.6",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "psutil>=7.2.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5",
    "typer>=0.27.3",
]

[project.scripts]
refauna = "refauna_slm.cli:app"

[project.optional-dependencies]
judge = [
    "anthropic>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refauna_slm"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
